name: Sync Upstream Tags

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream repository
        run: |
          git remote add upstream https://github.com/freeok/so-novel.git

      # 关键改动：fetch 时清理本地残留的远程 tag 引用
      - name: Fetch upstream tags with prune
        run: |
          git fetch upstream --tags --prune-tags --force
          echo "✅ Fetched and pruned tags from upstream"

      - name: Find latest tag not existing locally
        id: check
        run: |
          # 获取上游最新 tag（按版本号排序）
          LATEST_TAG=$(git ls-remote --tags upstream | grep -o 'v[0-9][^^{}]*' | sort -V | tail -n 1)
          echo "Latest upstream tag: $LATEST_TAG"
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT

          # 检查本地是否存在该 tag（现在本地已经过 prune，结果应该准确）
          if git rev-parse "$LATEST_TAG" >/dev/null 2>&1; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
            echo "ℹ️ Tag $LATEST_TAG exists in local repo"
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
            echo "✅ Tag $LATEST_TAG does NOT exist locally"
          fi

      - name: Push latest tag if new
        if: steps.check.outputs.tag_exists == 'false'
        run: |
          TAG=${{ steps.check.outputs.latest_tag }}
          echo "📦 Pushing new tag: $TAG"
          git push origin $TAG
          echo "✅ Successfully synced: $TAG"

      - name: Log result
        run: |
          if [ "${{ steps.check.outputs.tag_exists }}" == "true" ]; then
            echo "ℹ️ No new tags to sync"
          else
            echo "✅ Synced: ${{ steps.check.outputs.latest_tag }}"
          fi
