name: Sync Upstream Tags

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream repository
        run: |
          git remote add upstream https://github.com/freeok/so-novel.git

      - name: Fetch upstream tags
        run: |
          git fetch upstream --tags

      - name: Find and push latest new tag
        run: |
          # 获取本地所有 tags
          LOCAL_TAGS=$(git tag -l "v*")
          echo "Local tags count: $(echo "$LOCAL_TAGS" | wc -l)"
          
          # 获取上游最新 tag（按版本号排序取第一个）
          LATEST_TAG=$(git ls-remote --tags upstream | grep -o 'v[0-9][^^{}]*' | sort -V | tail -n 1)
          echo "Latest upstream tag: $LATEST_TAG"
          
          # 检查本地是否已存在
          if echo "$LOCAL_TAGS" | grep -q "^$LATEST_TAG$"; then
            echo "Tag $LATEST_TAG already exists locally, skipping..."
            exit 0
          fi
          
          # 推送最新 tag
          echo "Pushing new tag: $LATEST_TAG"
          git push origin $LATEST_TAG
          
          echo "✅ Successfully synced: $LATEST_TAG"
