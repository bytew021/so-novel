name: Sync Upstream Tags

on:
  schedule:
    # 定时运行，例如每 6 小时运行一次，可以根据需要调整 [citation:1]
    - cron: '0 */6 * * *'
  # 也支持手动触发，方便测试
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4
        with:
          # 拉取完整历史，这是同步 tag 所必需的
          fetch-depth: 0
          # 使用 GITHUB_TOKEN 以便有权限推送更改到你的 fork
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream repository
        run: |
          # 添加上游仓库为远程仓库，命名为 'upstream'
          # 注意：请将下面的地址替换为实际的上游仓库地址
          git remote add upstream https://github.com/freeok/so-novel.git

      - name: Fetch tags from upstream
        run: |
          # 从上游仓库获取所有 tag [citation:2][citation:5][citation:9]
          git fetch upstream --tags

      - name: Push tags to your fork
        run: |
          # 将所有新获取的 tag 推送到你自己的 origin (fork) 仓库 [citation:2][citation:5][citation:9]
          git push origin --tags
