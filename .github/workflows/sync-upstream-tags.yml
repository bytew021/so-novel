name: Sync Upstream Tags

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream repository
        run: |
          git remote add upstream https://github.com/freeok/so-novel.git

      # 关键：fetch 时清理本地已不存在的远程引用
      - name: Fetch and prune all
        run: |
          # --prune 清理 origin 中已删除的引用
          git fetch origin --prune --tags
          # --prune-tags 清理 upstream 中已删除的引用
          git fetch upstream --prune --prune-tags --tags --force
          echo "✅ All tags pruned and fetched"

      - name: Find latest new tag
        id: check
        run: |
          # 获取上游最新 tag
          LATEST_TAG=$(git ls-remote --tags upstream | grep -o 'v[0-9][^^{}]*' | sort -V | tail -n 1)
          echo "Latest upstream tag: $LATEST_TAG"
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          
          # 检查本地是否存在（现在应该准确了）
          if git rev-parse "$LATEST_TAG" >/dev/null 2>&1; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
            echo "⚠️ Tag $LATEST_TAG already exists locally"
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
            echo "✅ Tag $LATEST_TAG is NEW"
          fi

      - name: Push new tag
        if: steps.check.outputs.tag_exists == 'false'
        run: |
          TAG=${{ steps.check.outputs.latest_tag }}
          echo "📦 Pushing new tag: $TAG"
          git push origin $TAG
          echo "✅ Successfully synced: $TAG"

      - name: Log result
        run: |
          if [ "${{ steps.check.outputs.tag_exists }}" == "true" ]; then
            echo "ℹ️ No new tags to sync"
          else
            echo "✅ Synced: ${{ steps.check.outputs.latest_tag }}"
          fi
