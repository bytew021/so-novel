name: Docker Hub Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches-ignore: 
      - '**'

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Maven
        run: sudo apt-get update && sudo apt-get install -y maven

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Debug Maven compiler version
        run: |
          mvn help:effective-pom | grep -A 15 maven-compiler-plugin || echo "No explicit compiler plugin found"
          echo ${GITHUB_REF_NAME}

      - name: Build app.jar
        run: |
          bash bin/release-linux.sh
          cp -r target/sonovel-linux_x64/{app.jar,config.ini,rules} .

      # 登录 Docker Hub
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      # 构建并推送 Docker 镜像到 Docker Hub
      - name: Build and Push Docker image
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/sonovel
          
          echo "Building Docker image..."
          echo "Version: $VERSION"
          echo "Image: $IMAGE_NAME"
          
          docker build \
            -t $IMAGE_NAME:$VERSION \
            -t $IMAGE_NAME:latest \
            .
          
          echo "Pushing to Docker Hub..."
          docker push $IMAGE_NAME:$VERSION
          docker push $IMAGE_NAME:latest

      # 输出镜像地址
      - name: Output image info
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/sonovel
          
          echo "=========================================="
          echo "✅ Docker image published successfully!"
          echo "=========================================="
          echo ""
          echo "📦 Docker Hub:"
          echo "  ${IMAGE_NAME}:$VERSION"
          echo "  ${IMAGE_NAME}:latest"
          echo ""
          echo "Pull command:"
          echo "  docker pull ${IMAGE_NAME}:$VERSION"
