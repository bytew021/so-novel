name: Docker Hub Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '手动构建指定 tag（如 v1.11.0，留空则使用最新代码）'
        required: false
        type: string
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine tag and version
        id: tag_info
        run: |
          # 判断触发方式
          if [ -n "${{ inputs.tag }}" ]; then
            # 手动触发：使用用户指定的 tag
            TAG="${{ inputs.tag }}"
            echo "📌 Manual trigger - specified tag: $TAG"
          elif [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref_name }}" == v* ]]; then
            # push tag 触发：使用 tag 名称
            TAG="${{ github.ref_name }}"
            echo "📌 Push tag trigger - tag: $TAG"
          else
            # 手动触发但未指定 tag：使用默认分支最新代码
            TAG="latest"
            echo "📌 Manual trigger - no tag specified, using latest code"
          fi
          
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          # 如果指定了 tag，切换到该 tag
          if [ -n "${{ inputs.tag }}" ]; then
            echo "➡️ Checking out tag: $TAG"
            git checkout $TAG
          fi

      - name: Setup Maven
        run: sudo apt-get update && sudo apt-get install -y maven

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Debug build info
        run: |
          echo "Tag: ${{ steps.tag_info.outputs.tag }}"
          echo "Version: ${{ steps.tag_info.outputs.version }}"
          mvn help:effective-pom | grep -A 15 maven-compiler-plugin || echo "No explicit compiler plugin found"

      - name: Build app.jar
        run: |
          bash bin/release-linux.sh
          cp -r target/sonovel-linux_x64/{app.jar,config.ini,rules} .

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      - name: Build and Push Docker image
        run: |
          VERSION=${{ steps.tag_info.outputs.version }}
          IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/sonovel
          
          echo "=========================================="
          echo "Building Docker image..."
          echo "  Image: $IMAGE_NAME"
          echo "  Version: $VERSION"
          echo "=========================================="
          
          docker build \
            -t $IMAGE_NAME:$VERSION \
            -t $IMAGE_NAME:latest \
            .
          
          echo "Pushing to Docker Hub..."
          docker push $IMAGE_NAME:$VERSION
          docker push $IMAGE_NAME:latest

      - name: Output image info
        run: |
          VERSION=${{ steps.tag_info.outputs.version }}
          IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/sonovel
          
          echo "=========================================="
          echo "✅ Docker image published successfully!"
          echo "=========================================="
          echo ""
          echo "📦 Docker Hub:"
          echo "  ${IMAGE_NAME}:$VERSION"
          echo "  ${IMAGE_NAME}:latest"
          echo ""
          echo "Pull command:"
          echo "  docker pull ${IMAGE_NAME}:$VERSION"
          echo ""
          echo "Trigger: ${{ github.event_name }}"
